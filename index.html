<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>惜惜 Sioh-Sioh — 應用程式設計規格書</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:0;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const NAV = ["品牌總覽", "系統架構", "使用流程", "功能規格", "科學根據", "市場分析"];

    function App() {
      const [active, setActive] = useState("品牌總覽");

      return (
        <div style={{
          fontFamily: "'Noto Serif TC', 'Georgia', serif",
          background: "#faf7f2",
          minHeight: "100vh",
          color: "#1c1c2e",
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
            * { box-sizing: border-box; }
            .nav-btn { transition: all 0.2s ease; }
            .nav-btn:hover { opacity: 1 !important; }
            .card-hover { transition: box-shadow 0.2s, transform 0.2s; }
            .card-hover:hover { box-shadow: 0 8px 32px rgba(28,28,46,0.12); transform: translateY(-2px); }
            @keyframes breathe {
              0%, 100% { transform: scale(1); opacity: 0.6; }
              50% { transform: scale(1.18); opacity: 1; }
            }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(12px); }
              to { opacity: 1; transform: translateY(0); }
            }
            .fade-in { animation: fadeIn 0.4s ease forwards; }
            .breathe { animation: breathe 4s ease-in-out infinite; }
            ::-webkit-scrollbar { width: 4px; height: 4px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #c9a882; border-radius: 4px; }
          `}</style>

          {/* Header */}
          <header style={{
            background: "#1c2b24",
            color: "#faf7f2",
            padding: "0 36px",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            position: "sticky",
            top: 0,
            zIndex: 100,
            boxShadow: "0 1px 32px rgba(0,0,0,0.22)",
            height: 64,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <div style={{ position: "relative", width: 36, height: 36 }}>
                <div className="breathe" style={{
                  position: "absolute", inset: 0,
                  borderRadius: "50%",
                  background: "radial-gradient(circle, #e8b88a 0%, #c97d50 100%)",
                }} />
                <div style={{
                  position: "absolute", inset: "30%",
                  borderRadius: "50%",
                  background: "#1c2b24",
                }} />
              </div>
              <div>
                <div style={{ fontSize: 22, fontWeight: 900, letterSpacing: 6, color: "#faf7f2" }}>惜惜</div>
                <div style={{ fontSize: 10, color: "rgba(250,247,242,0.5)", letterSpacing: 3, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 300 }}>應用程式設計規格書</div>
              </div>
            </div>
            <nav style={{ display: "flex", gap: 2 }}>
              {NAV.map(n => (
                <button key={n} className="nav-btn" onClick={() => setActive(n)} style={{
                  background: active === n ? "rgba(201,160,130,0.2)" : "transparent",
                  border: "none",
                  borderBottom: active === n ? "2px solid #c9a082" : "2px solid transparent",
                  color: active === n ? "#e8c9a8" : "rgba(250,247,242,0.5)",
                  padding: "8px 14px",
                  cursor: "pointer",
                  fontFamily: "'Noto Sans TC', sans-serif",
                  fontSize: 13,
                  fontWeight: active === n ? 700 : 400,
                  letterSpacing: 1,
                }}>{n}</button>
              ))}
            </nav>
          </header>

          <main className="fade-in" key={active} style={{ maxWidth: 1120, margin: "0 auto", padding: "52px 28px 100px" }}>
            {active === "品牌總覽" && <BrandSection />}
            {active === "系統架構" && <ArchSection />}
            {active === "使用流程" && <FlowSection />}
            {active === "功能規格" && <FeatureSection />}
            {active === "科學根據" && <ScienceSection />}
            {active === "市場分析" && <MarketSection />}
          </main>
        </div>
      );
    }

    /* ── 共用元件 ── */

    function SecTitle({ main, sub, desc }) {
      return (
        <div style={{ marginBottom: 44 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 14, flexWrap: "wrap" }}>
            <h1 style={{ fontSize: 38, fontWeight: 900, margin: 0, color: "#1c2b24", letterSpacing: 2 }}>{main}</h1>
            {sub && <span style={{ fontSize: 15, color: "#8a7a6a", fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 300, letterSpacing: 1 }}>{sub}</span>}
          </div>
          {desc && <p style={{ fontSize: 14, color: "#5a5248", margin: "14px 0 0", maxWidth: 720, lineHeight: 1.9, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 300 }}>{desc}</p>}
          <div style={{ marginTop: 18, display: "flex", gap: 6 }}>
            <div style={{ height: 3, width: 48, background: "#c97d50", borderRadius: 2 }} />
            <div style={{ height: 3, width: 16, background: "#e8c9a8", borderRadius: 2 }} />
          </div>
        </div>
      );
    }

    function Card({ children, style = {}, hover = true }) {
      return (
        <div className={hover ? "card-hover" : ""} style={{
          background: "#fff",
          borderRadius: 18,
          padding: "28px 32px",
          boxShadow: "0 2px 18px rgba(28,28,46,0.06)",
          border: "1px solid rgba(201,160,130,0.15)",
          ...style,
        }}>{children}</div>
      );
    }

    function Label({ text, color = "#7a9e7e" }) {
      return (
        <span style={{
          display: "inline-block",
          background: color + "18",
          color,
          border: `1px solid ${color}35`,
          borderRadius: 20,
          padding: "3px 11px",
          fontSize: 10,
          fontFamily: "'Noto Sans TC', sans-serif",
          fontWeight: 700,
          letterSpacing: 1.5,
        }}>{text}</span>
      );
    }

    function StatBox({ num, label, note, color }) {
      return (
        <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 14, padding: "16px 18px" }}>
          <div style={{ fontSize: 28, fontWeight: 900, color }}>{num}</div>
          <div style={{ fontSize: 12, fontFamily: "'Noto Sans TC', sans-serif", color: "rgba(250,247,242,0.8)", marginTop: 2, fontWeight: 300 }}>{label}</div>
          {note && <div style={{ fontSize: 10, color: "rgba(250,247,242,0.4)", marginTop: 2, fontFamily: "'Noto Sans TC', sans-serif" }}>{note}</div>}
        </div>
      );
    }

    /* ── 品牌總覽 ── */
    function BrandSection() {
      return (
        <div>
          <SecTitle
            main="品牌總覽"
            sub="Brand Overview"
            desc="惜惜是一款專為台灣使用者設計的情緒調節數位工具。以神經科學為基礎（情感環形模型、生理嘆息、心率變異回饋），深度適配台灣文化心理學——以身體症狀為入口、規避污名標籤、尊重自主情緒調節。"
          />

          <Card hover={false} style={{ background: "linear-gradient(135deg, #1c2b24 0%, #2d4a38 100%)", color: "#faf7f2", marginBottom: 28, overflow: "hidden", position: "relative" }}>
            <div style={{ position: "absolute", right: -40, top: -40, width: 220, height: 220, borderRadius: "50%", background: "rgba(201,125,80,0.12)" }} />
            <div style={{ position: "absolute", right: 60, top: 40, width: 120, height: 120, borderRadius: "50%", background: "rgba(232,200,168,0.08)" }} />
            <div style={{ display: "flex", gap: 48, flexWrap: "wrap", alignItems: "center", position: "relative", zIndex: 1 }}>
              <div style={{ flex: 1, minWidth: 280 }}>
                <div style={{ fontSize: 80, fontWeight: 900, lineHeight: 1, color: "#e8c9a8", letterSpacing: 8, marginBottom: 6 }}>惜惜</div>
                <div style={{ fontSize: 14, color: "rgba(232,200,168,0.7)", letterSpacing: 2, marginBottom: 6, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 300 }}>Sioh · Sioh</div>
                <div style={{ fontSize: 18, fontWeight: 300, color: "rgba(250,247,242,0.85)", marginBottom: 6, letterSpacing: 1 }}>惜惜你的心</div>
                <div style={{ fontSize: 13, color: "rgba(250,247,242,0.5)", marginBottom: 24, fontFamily: "'Noto Sans TC', sans-serif", fontStyle: "italic" }}>你值得被好好對待</div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  <Label text="數位情緒工具" color="#c9a082" />
                  <Label text="台灣在地設計" color="#7aae8e" />
                  <Label text="文化適配 CBT" color="#c97d50" />
                </div>
              </div>
              <div style={{ flex: 1, minWidth: 260 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                  <StatBox num="18%" label="全球市場年複成長率" note="2025–2030" color="#e8c9a8" />
                  <StatBox num="38%" label="亞太區市場占比" note="佔全球心理健康App市場" color="#e8c9a8" />
                  <StatBox num="89%" label="台灣CBT App留存率" note="台灣大學生RCT臨床試驗" color="#e8c9a8" />
                  <StatBox num="零" label="語音資料上傳雲端" note="裝置端Whisper，完全保護隱私" color="#e8c9a8" />
                </div>
              </div>
            </div>
          </Card>

          <Card style={{ marginBottom: 28, borderLeft: "5px solid #c9a082" }}>
            <div style={{ fontSize: 13, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 700, color: "#c97d50", letterSpacing: 2, textTransform: "uppercase", marginBottom: 14 }}>命名邏輯</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 20 }}>
              {[
                { icon: "🗣️", layer: "台語溫柔層", desc: "「惜惜」在台語是安慰語——「惜惜你」＝溫柔地愛護你、心疼你。媽媽對孩子說的話，轉化為App對使用者的態度。" },
                { icon: "📖", layer: "國語意涵層", desc: "「珍惜」的惜——珍視自己的感受，不輕易否定，不逃避，好好對待自己的心。" },
                { icon: "🔍", layer: "SEO策略層", desc: "雙字疊詞搜尋辨識度高。搭配副關鍵字「情緒調節App」「台灣心理健康」「身心平衡工具」補強搜尋流量。" },
                { icon: "🚫", layer: "污名規避層", desc: "完全沒有臨床感。「惜惜」不會讓人聯想到精神科或心理疾病，降低stigma驅動的下載障礙。" },
              ].map(l => (
                <div key={l.layer}>
                  <div style={{ fontSize: 20, marginBottom: 6 }}>{l.icon}</div>
                  <div style={{ fontSize: 12, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 700, color: "#1c2b24", marginBottom: 6 }}>{l.layer}</div>
                  <p style={{ fontSize: 12, fontFamily: "'Noto Sans TC', sans-serif", color: "#5a5248", lineHeight: 1.8, margin: 0, fontWeight: 300 }}>{l.desc}</p>
                </div>
              ))}
            </div>
          </Card>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 20, marginBottom: 28 }}>
            {[
              { icon: "🫀", zh: "身體先入門", en: "Somatic Entry Bridge", color: "#c97d50", desc: "從不問「你憂鬱嗎？」，而是問「你現在身體有什麼感覺？」——胸悶、疲倦、心跳加速。以身體為入口，符合台灣文化中身體化（somatization）為情緒表達的主要管道。" },
              { icon: "⚫", zh: "無標籤情緒座標", en: "Non-Stigmatizing Affect Grid", color: "#2d4a38", desc: "用Russell情感環形模型的二維座標（愉悅度 × 喚起度）取代臨床標籤。點一個點，就觸發神經層面的情感命名（affect labeling）——杏仁核活性自然降低，無需使用任何醫療詞彙。" },
              { icon: "🌬️", zh: "生理優先穩定", en: "Physiological Rescue First", color: "#7aae8e", desc: "高喚起＋負向情緒狀態，立即啟動生理嘆息（Physiological Sigh）引導動畫——先讓自律神經系統穩定，再進行任何認知層面的介入。科學依據：Huberman & Spiegel 2023 RCT。" },
              { icon: "🪷", zh: "自主情緒調節", en: "SRWNE Cultural CBT", color: "#c9a082", desc: "以「情緒自我調節的自主性壓抑（SRWNE）」框架重新設計CBT。區分「被迫沉默（有害）」與「出於珍惜關係而選擇不說（保護性）」——這是西方心理學從未做到的台灣本土化。" },
            ].map(p => (
              <Card key={p.zh} style={{ borderTop: `4px solid ${p.color}` }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>{p.icon}</div>
                <div style={{ fontSize: 10, fontFamily: "'Noto Sans TC', sans-serif", color: p.color, fontWeight: 700, letterSpacing: 2, marginBottom: 4 }}>{p.en}</div>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 10, color: "#1c1c2e" }}>{p.zh}</div>
                <p style={{ fontSize: 12, fontFamily: "'Noto Sans TC', sans-serif", color: "#5a5248", lineHeight: 1.9, margin: 0, fontWeight: 300 }}>{p.desc}</p>
              </Card>
            ))}
          </div>

          <Card>
            <div style={{ fontSize: 13, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 700, color: "#7aae8e", letterSpacing: 2, marginBottom: 18 }}>競爭定位分析</div>
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, fontFamily: "'Noto Sans TC', sans-serif" }}>
                <thead>
                  <tr style={{ background: "#faf7f2" }}>
                    {["功能特色", "惜惜", "沙發心理 CouchSpace", "Calm / Headspace", "Mind Booster Green"].map((h, i) => (
                      <th key={h} style={{ padding: "11px 16px", textAlign: "left", color: i === 1 ? "#1c2b24" : "#8a7a6a", fontWeight: i === 1 ? 900 : 600, borderBottom: "2px solid #f0e8dc", whiteSpace: "nowrap" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[
                    ["身體症狀入口", "✅ 核心設計", "❌ 無", "❌ 無", "❌ 無"],
                    ["二維情緒座標（環形模型）", "✅ 主要UI", "❌ 無", "❌ 無", "❌ 無"],
                    ["生理嘆息視覺引導", "✅ 急性介入", "⚠️ 被動音樂", "⚠️ 被動音樂", "❌ 無"],
                    ["SRWNE文化適配CBT", "✅ 框架原生", "❌ 無", "❌ 無", "⚠️ 部分"],
                    ["裝置端語音處理（隱私）", "✅ Edge Whisper", "❌ 雲端", "❌ 雲端", "❌ 無"],
                    ["HRV生物回饋", "✅ 第二階段", "❌ 無", "❌ 無", "❌ 無"],
                    ["繁體中文原生介面", "✅ 原生", "✅ 原生", "⚠️ 翻譯版", "✅ 原生"],
                    ["企業B2B模組", "✅ 主要營收", "✅ FitBack案例", "⚠️ 有限", "❌ 無"],
                  ].map((row, i) => (
                    <tr key={i} style={{ background: i % 2 === 0 ? "#fff" : "#fdfaf6" }}>
                      {row.map((cell, j) => (
                        <td key={j} style={{
                          padding: "10px 16px", borderBottom: "1px solid #f5ede3",
                          color: j === 1 ? "#1c2b24" : "#5a5248",
                          fontWeight: j === 1 ? 700 : 300,
                        }}>{cell}</td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    }

    /* ── 系統架構 ── */
    function ArchSection() {
      return (
        <div>
          <SecTitle
            main="系統架構"
            sub="System Architecture"
            desc="三階段治療管線：身體感知 → 生理急救 → 文化適配認知重建。所有語音處理在裝置端完成，確保最高隱私保護。"
          />

          <Card hover={false} style={{ marginBottom: 28 }}>
            <div style={{ fontSize: 13, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 700, color: "#7aae8e", letterSpacing: 2, marginBottom: 28 }}>核心治療管線</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 40px 1fr 40px 1fr", gap: 0, alignItems: "start" }}>
              {[
                { phase: "第一階段", zh: "身體感知", en: "Somatic Recognition", icon: "🫀", color: "#c97d50",
                  steps: ["使用者輸入身體症狀（胸悶、疲倦、心悸）", "身體→情緒的映射演算法啟動", "逐步引導內感受（interoception）詞彙", "呈現二維情緒座標供選擇"],
                  science: "身體化（somatization）是台灣文化中被授權的情緒表達方式（台灣精神醫學文獻）" },
                { phase: "第二階段", zh: "生理急救", en: "Physiological Rescue", icon: "🌬️", color: "#1c2b24",
                  steps: ["高喚起＋負向情緒 → 立即啟動生理嘆息動畫", "視覺化1:2吸氣吐氣比例引導（60秒）", "第二階段：HRV追蹤確認副交感神經轉換", "靜息呼吸頻率降低作為生物標記"],
                  science: "Huberman & Spiegel（2023）Cell Reports Medicine RCT：循環嘆息在急性焦慮舒緩上優於正念冥想" },
                { phase: "第三階段", zh: "文化認知重建", en: "Cultural CBT", icon: "🪷", color: "#7aae8e",
                  steps: ["高粒度情感命名（繁體中文詞庫）", "SRWNE評估：被迫沉默 vs 自主選擇", "以關係和諧價值觀為框架的認知重建", "正向情緒保存（Savoring）模組"],
                  science: "SRWNE量表（Chu等人）：自主性情緒壓抑與焦慮／失眠呈負相關" },
              ].map((p, i) => (
                <React.Fragment key={p.phase}>
                  <div style={{ borderLeft: `4px solid ${p.color}`, paddingLeft: 20 }}>
                    <div style={{ fontSize: 10, fontFamily: "'Noto Sans TC', sans-serif", color: p.color, fontWeight: 700, letterSpacing: 2 }}>{p.phase}</div>
                    <div style={{ fontSize: 22, margin: "6px 0 2px" }}>{p.icon}</div>
                    <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 2 }}>{p.zh}</div>
                    <div style={{ fontSize: 11, fontFamily: "'Noto Sans TC', sans-serif", color: "#8a7a6a", marginBottom: 14 }}>{p.en}</div>
                    <ul style={{ margin: 0, paddingLeft: 16 }}>
                      {p.steps.map((s, j) => (
                        <li key={j} style={{ fontSize: 12, fontFamily: "'Noto Sans TC', sans-serif", color: "#444", marginBottom: 7, lineHeight: 1.7, fontWeight: 300 }}>{s}</li>
                      ))}
                    </ul>
                    <div style={{ marginTop: 14, padding: "10px 12px", background: p.color + "10", borderRadius: 8, fontSize: 11, fontFamily: "'Noto Sans TC', sans-serif", color: p.color, lineHeight: 1.6 }}>
                      📚 {p.science}
                    </div>
                  </div>
                  {i < 2 && <div key={"arr"+i} style={{ display: "flex", alignItems: "center", justifyContent: "center", color: "#d0c4b4", fontSize: 24, paddingTop: 60 }}>→</div>}
                </React.Fragment>
              ))}
            </div>
          </Card>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 28 }}>
            <Card>
              <div style={{ fontSize: 13, fontFamily: "'Noto Sans TC', sans-serif", fontWeight: 700, color: "#7aae8e", letterSpacing: 2, marginBottom: 18 }}>技術架構</div>
              {[
                { layer: "前端框架", tech: "React Native（iOS + Android）", note: "繁體中文 i18n 優先" },
                { layer: "語音轉文字", tech: "Whisper（裝置端邊緣運算）", note: "零雲端成本，完全隱私保護" },
                { layer: "自然語言處理", tech: "本地語意解析器", note: "身體症狀 → 情緒候選詞映射" },
                { layer: "情緒座標", tech: "自訂觸控畫布", note: "二維環形模型座標輸入" },
                { layer: "呼吸動畫", tech: "Lottie / SVG 動畫", note: "生理嘆息視覺引導" },
                { layer: "HRV（第二階段）", tech: "Apple Watch / Garmin SDK", note: "共振頻率生物回饋" },
                { layer: "ML個人化", tech: "裝置端 Core ML / TFLite", note: "DFDLOF 自適應治療路徑" },
                { layer: "資料隱私", tech: "GDPR對應 + GxP Annex 11", note: "角色權限控制、稽核記錄" },
              ].map(row => (
                <div key={row.layer} style={{ display: "flex", gap: 14, marginBottom: 11, alignItems: "flex-start" }}>
